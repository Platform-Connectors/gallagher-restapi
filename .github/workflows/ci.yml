name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
      pull-requests: write

    steps:
      - uses: Platform-Connectors/actions/ci@fix-cov-diff
        id: ci
        with:
          python-version: "3.11"
          package-source-folder: src/gallagher_restapi
          total-coverage-threshold: 90