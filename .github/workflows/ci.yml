name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
      pull-requests: write

    steps:
      - uses: Platform-Connectors/actions/ci@fix-cov-diff
        id: ci
        with:
          python-version: "3.11"
          package-source-folder: src/gallagher_restapi

      - name: Log Coverage Summary
        shell: bash
        run: |
          echo "| **Total Project Coverage** | ${{ steps.ci.outputs.total-coverage }}% | ${{ inputs.total-coverage-threshold || '93' }}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **PR Changed-Lines (Diff)** | ${{ steps.ci.outputs.diff-coverage }}% | ${{ inputs.diff-coverage-threshold || '100' }}% |" >> "$GITHUB_STEP_SUMMARY"